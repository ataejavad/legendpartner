  <rect width="600" height="900" fill="url(#h-sky)"/>
  <ellipse cx="170" cy="380" rx="220" ry="180" fill="url(#h-sun)" filter="url(#h-blur)"/>
  <path d="M0 470 L600 470 L600 900 L0 900 Z" fill="url(#h-sea)"/>
  <g stroke="#E4D6B6" stroke-opacity=".13" stroke-width="1.4">
    <path d="M0 528h600"/><path d="M0 586h600"/><path d="M0 650h600"/>
    <path d="M0 722h600"/><path d="M0 804h600"/>
  </g>
  <path d="M0 470 L112 404 L206 452 L318 388 L432 448 L600 396 L600 470 Z" fill="#08080A" fill-opacity=".82"/>
  <g fill="#E4D6B6" fill-opacity=".16">
    <path d="M356 470 L356 356 L420 470 Z"/>
    <rect x="352" y="466" width="76" height="9" rx="4.5"/>
  </g>
</svg>
