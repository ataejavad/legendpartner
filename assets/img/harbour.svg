<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 900" preserveAspectRatio="xMidYMid slice" role="img" aria-label="A coastline at first light">
  <defs>
    <linearGradient id="h-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1B1A1E"/><stop offset=".58" stop-color="#0E0E11"/>
      <stop offset="1" stop-color="#08080A"/>
    </linearGradient>
    <radialGradient id="h-sun" cx=".28" cy=".42" r=".46">
      <stop offset="0" stop-color="#E4D6B6" stop-opacity=".42"/>
      <stop offset="1" stop-color="#E4D6B6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="h-sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E4D6B6" stop-opacity=".14"/>
      <stop offset="1" stop-color="#E4D6B6" stop-opacity=".02"/>
    </linearGradient>
    <filter id="h-blur" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="34"/></filter>
