<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" fill="none" role="img" aria-label="Legend — identity verified">
  <title>Legend — identity verified</title>
  <defs>
    <path id="sealArc" d="M120 214a94 94 0 0 1 0-188" transform="rotate(180 120 120)"/>
  </defs>

  <!-- the closed room -->
  <circle cx="120" cy="120" r="112" stroke="currentColor" stroke-width="1" opacity=".35"/>
  <circle cx="120" cy="120" r="94"  stroke="currentColor" stroke-width="1" opacity=".55"/>

  <!-- the mark: a line that is not crossed, and the stroke resting upon it -->
  <path d="M86 112h68"  stroke="currentColor" stroke-width="3" stroke-linecap="square"/>
  <path d="M120 66v46"  stroke="currentColor" stroke-width="3" stroke-linecap="square"/>

  <!-- verified: a single confirming stroke, set below the mark -->
  <path d="M104 140l11 11 22-22" stroke="currentColor" stroke-width="2.4"
        stroke-linecap="square" stroke-linejoin="miter" opacity=".9"/>

  <text font-family="Inter, Helvetica, Arial, sans-serif" font-size="11" font-weight="500"
        letter-spacing="4.2" fill="currentColor" opacity=".8">
    <textPath href="#sealArc" startOffset="50%" text-anchor="middle">IDENTITY VERIFIED</textPath>
  </text>

  <text x="120" y="196" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12"
        font-weight="500" letter-spacing="6" fill="currentColor" text-anchor="middle">LEGEND</text>
</svg>
