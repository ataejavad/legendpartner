<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 900" preserveAspectRatio="xMidYMid slice" role="img" aria-label="A room at dusk, lit from one side">
  <defs>
    <linearGradient id="s-ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#17171A"/><stop offset="1" stop-color="#08080A"/>
    </linearGradient>
    <radialGradient id="s-light" cx=".68" cy=".26" r=".62">
      <stop offset="0" stop-color="#E4D6B6" stop-opacity=".40"/>
      <stop offset="1" stop-color="#E4D6B6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="s-fall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E4D6B6" stop-opacity=".16"/>
      <stop offset="1" stop-color="#E4D6B6" stop-opacity="0"/>
    </linearGradient>
    <filter id="s-blur" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="30"/></filter>
  </defs>
  <rect width="600" height="900" fill="url(#s-ground)"/>
  <rect width="600" height="900" fill="url(#s-light)"/>
  <!-- a tall window, and the light it throws on the floor -->
  <g opacity=".9">
    <rect x="330" y="120" width="190" height="430" rx="95" fill="url(#s-fall)"/>
    <rect x="330" y="120" width="190" height="430" rx="95" fill="none" stroke="#E4D6B6" stroke-opacity=".18"/>
    <line x1="425" y1="120" x2="425" y2="550" stroke="#E4D6B6" stroke-opacity=".12"/>
  </g>
  <g filter="url(#s-blur)" opacity=".55">
    <ellipse cx="300" cy="700" rx="230" ry="70" fill="#E4D6B6" fill-opacity=".12"/>
  </g>
  <g stroke="#E4D6B6" stroke-opacity=".08" fill="none">
    <path d="M0 640h600"/><path d="M0 646h600"/>
  </g>
</svg>
